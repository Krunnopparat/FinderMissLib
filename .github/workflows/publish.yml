name: Publish to PyPI

# ออกเวอร์ชันเฉพาะตอน push tag (เช่น v0.1.0) ไม่อย่างนั้นทุก push จะพยายามอัปโหลดเวอร์ชันเดิมซ้ำ
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  # แยกจาก build เพื่อให้สิทธิ์ id-token (ใช้ยืนยันตัวกับ PyPI) อยู่แค่ใน job ที่อัปโหลดจริง
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/findermiss
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
